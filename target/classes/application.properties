spring.application.name=hris-app
spring.profiles.active=${APP_PROFILE:local}

# Database
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:hris-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-2024}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload path
app.upload.dir=${APP_UPLOAD_DIR:uploads/photos}

server.port=${SERVER_PORT:8080}

spring.application.name=hris-app

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/hris_db
spring.datasource.username=postgres
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=hris-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-2024
app.jwt.expiration-ms=86400000

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload path
app.upload.dir=uploads/photos

server.port=8080
